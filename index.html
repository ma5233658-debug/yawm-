<title>يوم | تنظيم مواعيد رحيم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column, 5-tab bottom bar, sheets slide up for every form. The "day" is the unit: a vertical timeline of today's sessions is the signature element. Gold marker = the one highlight per screen. */
:root{
  --bg:#EFF2F8; --surface:#FFFFFF; --surface2:#E6EBF4; --ink:#14213D; --muted:#566383; --line:#D5DCEA;
  --accent:#1D4F91; --accent-text:#1D4F91; --on-accent:#FFFFFF; --mark:#F5BE4F; --on-mark:#2B1D00;
  --good:#17794A; --good-soft:#DCF2E6; --warn:#9A5600; --warn-soft:#FCEBCB; --bad:#B3261E; --bad-soft:#FBE0DD; --info-soft:#E1EAF9;
  --k-explain:#1D4F91; --k-exam:#C27A00; --k-review:#0F8B8D;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#172036; --surface2:#222E49; --ink:#E9EEF9; --muted:#9FADC9; --line:#2C3A5A;
    --accent:#6FB1EE; --accent-text:#8DC3F5; --on-accent:#071425; --mark:#F5BE4F; --on-mark:#2B1D00;
    --good:#4CC38A; --good-soft:#11331F; --warn:#F0A042; --warn-soft:#3A2810; --bad:#FF8E85; --bad-soft:#431C19; --info-soft:#1A2A4B;
    --k-explain:#6FB1EE; --k-exam:#F0B24A; --k-review:#3CC6C8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#172036; --surface2:#222E49; --ink:#E9EEF9; --muted:#9FADC9; --line:#2C3A5A;
  --accent:#6FB1EE; --accent-text:#8DC3F5; --on-accent:#071425; --mark:#F5BE4F; --on-mark:#2B1D00;
  --good:#4CC38A; --good-soft:#11331F; --warn:#F0A042; --warn-soft:#3A2810; --bad:#FF8E85; --bad-soft:#431C19; --info-soft:#1A2A4B;
  --k-explain:#6FB1EE; --k-exam:#F0B24A; --k-review:#3CC6C8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.3}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
a{color:var(--accent-text)}
.wrap{max-width:680px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 108px}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}
.view>*{min-width:0}
.muted{color:var(--muted)}.small{font-size:.875rem}.num{font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1.5px dashed var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.head{display:flex;flex-direction:column;gap:2px}
.mk{background:linear-gradient(transparent 52%,var(--mark) 52%);color:var(--ink);padding-inline:.2em;border-radius:3px}
.empty{color:var(--muted);padding-block:6px}

/* buttons */
.btn{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;padding:8px 6px;min-height:38px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 130px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:1px 10px;border-radius:99px;background:var(--surface2);color:var(--ink);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--accent-text)}
.chip.mark{background:var(--mark);color:var(--on-mark)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stats>div{display:flex;flex-direction:column;padding-inline:12px;border-inline-start:1.5px dashed var(--line);min-width:0}
.stats>div:first-child{border-inline-start:0;padding-inline-start:0}
.stats b{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.25;unicode-bidi:isolate}
.stats span{color:var(--muted);font-size:.85rem}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:14px;padding-block:6px;position:relative}
.tl .t{font-family:var(--f-display);font-weight:600;text-align:end;padding-top:10px;font-variant-numeric:tabular-nums;font-size:.95rem;unicode-bidi:isolate}
.tl .t small{display:block;font:400 .74rem var(--f-body);color:var(--muted)}
.tl .box{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--k-explain));border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl .box.is-cancelled{opacity:.55}
.tl .box.is-done{--c:var(--good)}
.tl .box.conf{outline:2px solid var(--bad)}
.tl .ttl{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer;background:none;border:0;text-align:start;padding:0;width:100%}
.tl .ttl b{font-weight:600}
.tl .box .acts .btn{flex:1 1 0;min-width:0;padding:0 8px}
.k-explain{--c:var(--k-explain)}.k-exam{--c:var(--k-exam)}.k-review{--c:var(--k-review)}
.day-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.now{background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:.75rem;font-weight:600;padding:1px 12px}

/* lists / cards */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:11px;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .what{display:flex;flex-direction:column;min-width:0}
.row .what b{font-weight:600;overflow-wrap:anywhere}
.row .what span{color:var(--muted);font-size:.86rem}
.row.tap{width:100%;background:none;border-inline:0;border-top:0;text-align:start;color:inherit}
.gcards{display:flex;flex-direction:column;gap:12px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:start;border-top:4px solid var(--c,var(--accent))}
.gc.s-primary{--c:var(--mark)}.gc.s-prep{--c:var(--k-review)}.gc.s-secondary{--c:var(--accent)}
.gc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--info-soft);align-items:flex-start}
.alert.warn{background:var(--warn-soft)}.alert.bad{background:var(--bad-soft)}
.alert b{display:block;font-weight:600}.alert button{margin-inline-start:auto;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.3;unicode-bidi:isolate}
.tile span{color:var(--muted);font-size:.85rem}
.tile.big{grid-column:1/-1;border-color:var(--good)}
.tile.big b{font-size:2.1rem;color:var(--good)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}.chk input{width:20px;height:20px;flex:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--mark);color:var(--on-mark);border-radius:14px;padding:12px 14px}
.demo p{flex:1 1 200px;font-weight:500}
.demo .btn{background:var(--on-mark);color:var(--mark);min-height:38px}
.search{width:100%}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.fld>legend{font-size:.86rem;color:var(--muted)}
fieldset.fld{border:0;padding:0;margin:0}
input[type=text],input[type=tel],input[type=search],input[type=number],input[type=date],input[type=time],input[type=password],input[type=url],select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[type=date],input[type=time],input[type=number],input[type=tel],input[type=url]{direction:ltr;text-align:right}
textarea{resize:vertical;min-height:80px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchips label{position:relative}
.dchips input{position:absolute;opacity:0;inset:0}
.dchips span{display:inline-flex;min-height:40px;align-items:center;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;font-weight:600}
.dchips input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dchips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
textarea.code{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;min-height:110px}

/* nav + sheets */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:680px;margin-inline:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:12px;position:relative}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent-text);background:var(--surface2)}
.nav .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
.sheet{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(8,14,28,.58)}
.panel{position:absolute;inset-inline:0;bottom:0;margin-inline:auto;max-width:680px;max-height:94%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.panel>*{flex-shrink:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;text-align:center;font-weight:500}
.dm{display:flex;flex-direction:column;gap:8px}
.dmr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dmr label{position:relative}.dmr input[type=checkbox]{position:absolute;opacity:0;inset:0}
.dmr label span{display:inline-flex;min-height:40px;min-width:96px;justify-content:center;align-items:center;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;font-weight:600}
.dmr input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dmr input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.dmr select{flex:1;min-width:120px}
.arow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}.tw table{border-collapse:collapse;width:100%;font-size:.88rem}.tw th,.tw td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}.tw th{color:var(--muted);font-weight:600}
.tl .box.school{--c:var(--muted)}
.reccode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;font-weight:700;letter-spacing:.08em;text-align:center;padding:16px 10px;border:2px dashed var(--accent);border-radius:14px;user-select:all;overflow-wrap:anywhere}
.lock input+input{margin-top:4px}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lock .box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock input{text-align:center;letter-spacing:.4em;font-size:1.4rem}
@media (max-width:380px){h1{font-size:1.6rem}.cols{grid-template-columns:1fr}.stats b{font-size:1.35rem}.tl li{grid-template-columns:50px 1fr;gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="wrap"><main id="view" class="view"></main></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
var KEY='yawm-rahim-v1', PRE='yawm-rahim-prerestore', storageOK=true;
var nf=new Intl.NumberFormat('ar-EG',{useGrouping:false,maximumFractionDigits:2});
var nfg=new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2});
function N(x){return nf.format(x||0);}
function M(x){return nfg.format(Math.round((x||0)*100)/100)+' ج.م';}
function pad(n){return n<10?'0'+n:''+n;}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dk(new Date());}
function pd(k){return new Date(k+'T00:00:00');}
function addDays(k,n){var d=pd(k);return dk(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
function dayDiff(a,b){return Math.round((pd(a)-pd(b))/864e5);}
function fmtDate(k){return pd(k).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});}
function shortDate(k){return pd(k).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});}
function tm(t){var p=(t||'00:00').split(':'),h=+p[0],m=+p[1],ap=h>=12?'م':'ص';h=h%12;if(h===0)h=12;return N(h)+':'+(m<10?'٠':'')+N(m)+' '+ap;}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function west(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/٫/g,'.');}
function toNum(v){var n=parseFloat(west(v));return isFinite(n)?n:NaN;}
function normName(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');}
function normPhone(s){return west(s||'').replace(/\D/g,'');}
function sum(a,f){var t=0;a.forEach(function(x){t+=f(x);});return t;}
function r2(x){return Math.round(x*100)/100;}
function $(s,r){return (r||document).querySelector(s);}
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var ORDER=[6,0,1,2,3,4,5];
var STAGE={primary:'ابتدائي',prep:'إعدادي',secondary:'ثانوي'};
var GRADES={primary:['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],prep:['الأول الإعدادي','الثاني الإعدادي','الثالث الإعدادي'],secondary:['الأول الثانوي','الثاني الثانوي','الثالث الثانوي']};
var KIND={explain:'شرح',exam:'امتحان',review:'مراجعة'};
var LST={scheduled:'مجدولة',done:'تمت',cancelled:'أُلغيت',postponed:'مؤجلة'};
var GST={open:'مفتوحة للتسجيل',full:'مكتملة',paused:'متوقفة مؤقتًا',ended:'منتهية'};
var PTYPE={course:'للكورس كله',month:'للشهر',week:'للأسبوع',session:'للحصة'};
var METHOD={cash:'نقدًا',transfer:'تحويل',wallet:'محفظة إلكترونية',other:'أخرى'};

/* ================= state ================= */
function hash53(str){var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;for(i=0;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);}
function blank(){return {v:1,demo:false,teacher:'',theme:'auto',nearFull:3,pin:null,groups:[],students:[],lessons:[],att:{},sc:{},school:[],rewards:[],log:[],rcpt:0,lastBackup:0,remind:{on:false,code:'',min:60,morning:true,server:''},created:Date.now()};}
function norm(o){
  var b=blank(),k;for(k in b)if(o[k]===undefined)o[k]=b[k];
  ['groups','students','lessons','log','school','rewards'].forEach(function(a){if(!Array.isArray(o[a]))o[a]=[];});
  ['att','sc'].forEach(function(a){if(!o[a]||typeof o[a]!=='object')o[a]={};});
  if(!o.remind||typeof o.remind!=='object')o.remind=blank().remind;if(!(o.remind.min>=5))o.remind.min=60;
  o.students.forEach(function(s){s.pays=s.pays||[];s.adj=s.adj||[];});
  o.groups.forEach(function(g){if(!g.dayMode||typeof g.dayMode!=='object')g.dayMode={};g.examEvery=g.examEvery||0;if(g.priceOnline===undefined||g.priceOnline==='')g.priceOnline=null;});
  o.lessons.forEach(function(l){l.mode=l.mode==='online'?'online':'in';l.link=l.link||'';l.notes=l.notes||'';l.max=l.max||0;l.hist=l.hist||[];});
  return o;
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1&&Array.isArray(o.groups))return norm(o);}}catch(e){}return null;}

var mrep={range:'month',from:'',to:''},stuBack=null,ctx=null,tab='today',wkOff=0,moneyRange='month',stQ='',sheetBack=null,pendingFn=null,locked=false,lastActive=Date.now();

/* ================= calculations ================= */
function grp(id){for(var i=0;i<S.groups.length;i++)if(S.groups[i].id===id)return S.groups[i];return null;}
function liveGroups(){return S.groups.filter(function(g){return !g.deleted;});}
function stu(id){for(var i=0;i<S.students.length;i++)if(S.students[i].id===id)return S.students[i];return null;}
function lsn(id){for(var i=0;i<S.lessons.length;i++)if(S.lessons[i].id===id)return S.lessons[i];return null;}
function activeOf(gid){return S.students.filter(function(s){return s.gid===gid&&s.active&&!s.deleted;});}
function remainingSeats(g){return Math.max(0,g.cap-activeOf(g.id).length);}
function effStatus(g){return g.status==='open'&&activeOf(g.id).length>=g.cap?'full':g.status;}
function sDue(s){return r2(s.due+accrued(s)+sum(s.adj,function(a){return a.amt;}));}
function sPaid(s){return r2(sum(s.pays,function(p){return p.void?0:p.amt;}));}
function sRem(s){return r2(sDue(s)-sPaid(s));}
function payState(s){var d=sDue(s),p=sPaid(s);return (d<=0||p>=d-0.001)?'paid':p>0?'part':'none';}
function defDue(g){return (g.ptype==='session'||g.ptype==='week')?0:g.price;}
function lessonsOf(gid){return S.lessons.filter(function(l){return l.gid===gid;}).sort(function(a,b){return a.date+a.time<b.date+b.time?-1:1;});}
function counts(g){var L=lessonsOf(g.id),c={ed:0,xd:0,rd:0};L.forEach(function(l){if(l.status==='done'){if(l.kind==='explain')c.ed++;else if(l.kind==='exam')c.xd++;else c.rd++;}});return c;}
function overlap(a,b){return a.date===b.date&&a.time<b.end&&b.time<a.end;}
function conflictsOf(l){return S.lessons.filter(function(o){var g=grp(o.gid);return o.id!==l.id&&o.status!=='cancelled'&&g&&!g.deleted&&overlap(o,l);});}
function allConflicts(from){
  var out=[],L=S.lessons.filter(function(l){var g=grp(l.gid);return l.status!=='cancelled'&&g&&!g.deleted&&l.date>=from;}),i,j;
  for(i=0;i<L.length;i++)for(j=i+1;j<L.length;j++)if(overlap(L[i],L[j]))out.push([L[i],L[j]]);
  L.forEach(function(l){schoolConf(l).forEach(function(x){out.push([l,{id:'sch'+x.id+l.date,school:true,name:x.name,date:l.date,time:x.time,end:x.end}]);});});
  return out;
}

function totals(){

  S.students.forEach(function(s){allPays+=sPaid(s);if(s.active&&!s.deleted){var g=grp(s.gid);if(g&&!g.deleted){exp+=sDue(s);out+=Math.max(0,sRem(s));}}});
  return {collected:r2(allPays),expected:r2(exp),out:r2(out)};
}

    if(!g.days.length)out.push({sev:'warn',t:g.name+': أيام الانعقاد مش محددة',d:'حددها من تعديل المجموعة.',act:'openG',arg:g.id});
    var c=counts(g);if(g.planned>0&&c.ed>=g.planned)out.push({sev:'info',t:g.name+': خلصت خطة الشرح',d:N(c.ed)+' من '+N(g.planned)+' حصة',act:'openG',arg:g.id});
    else if(g.planned>0&&g.planned-c.ed<=2&&c.ed>0)out.push({sev:'warn',t:g.name+': قربت تخلص الخطة',d:'فاضل '+N(g.planned-c.ed)+' حصة شرح',act:'openG',arg:g.id});
  });
  var owing=S.students.filter(function(s){var g=grp(s.gid);return s.active&&!s.deleted&&g&&!g.deleted&&sRem(s)>0.001;});
  if(owing.length)out.push({sev:'warn',t:N(owing.length)+' طالب عليهم فلوس',d:'إجمالي '+M(sum(owing,function(s){return sRem(s);})),act:'goMoney'});
  if(!S.lastBackup||Date.now()-S.lastBackup>7*864e5)out.push({sev:'warn',t:S.lastBackup?'آخر نسخة احتياطية قديمة':'لسه ما خدتش نسخة احتياطية',d:'خد نسخة من تبويب «المزيد» عشان بياناتك محفوظة على الجهاز ده بس.',act:'goMore'});
  var ord={bad:0,warn:1,info:2};out.sort(function(a,b){return ord[a.sev]-ord[b.sev];});
  return out;
}

function weekStartKey(k){var d=pd(k);d.setDate(d.getDate()-((d.getDay()+1)%7));return dk(d);}
function unitPrice(g,l){return (g.priceOnline!=null&&l.mode==='online')?g.priceOnline:g.price;}
function units(s){
  var g=grp(s.gid);if(!g||(g.ptype!=='session'&&g.ptype!=='week'))return [];
  var L=lessonsOf(g.id).filter(function(l){return l.status==='done'&&l.date>=s.joined&&!(S.att[l.id]&&S.att[l.id][s.id]==='a');});
  if(g.ptype==='session')return L.map(function(l){return {key:l.id,label:KIND[l.kind]+(l.n?' '+N(l.n):'')+' — '+shortDate(l.date),date:l.date,amt:unitPrice(g,l),lid:l.id};});
  var m={},out=[];
  L.forEach(function(l){var w=weekStartKey(l.date);if(!m[w]){m[w]={key:w,label:'أسبوع '+shortDate(w),date:w,amt:g.price,wk:w};out.push(m[w]);}});
  return out;
}
function accrued(s){return r2(sum(units(s),function(u){return u.amt;}));}
function unitStatus(s){
  var us=units(s),credit=sPaid(s)-s.due-sum(s.adj,function(a){return a.amt;}),cum=0;
  return us.map(function(u){var p=Math.min(u.amt,Math.max(0,credit-cum));cum+=u.amt;u.paid=r2(p);u.rem=r2(u.amt-p);u.state=u.rem<=0.001?'paid':(p>0?'part':'none');return u;});
}
function modeCounts(g){var c={inAll:0,inDone:0,onAll:0,onDone:0};lessonsOf(g.id).forEach(function(l){if(l.status==='cancelled')return;if(l.mode==='online'){c.onAll++;if(l.status==='done')c.onDone++;}else{c.inAll++;if(l.status==='done')c.inDone++;}});return c;}
function attStats(s){

  L.forEach(function(l){var v=S.att[l.id]&&S.att[l.id][s.id];if(v==='p'){r.p++;if(l.mode==='online')r.pOn++;else r.pIn++;}else if(v==='a')r.a++;else r.un++;});

}

  var all=S.students.filter(function(s){return s.gid===g.id;});
  return {g:g,st:st,rows:rows,mc:mc,c:c,exams:exams,rw:S.rewards.filter(function(r){return r.gid===g.id;}),col:sum(all,sPaid),out:sum(st,function(s){return Math.max(0,sRem(s));}),exp:sum(st,sDue)};

  if(preview){var on=preview.list.filter(function(l){return l.mode==='online';}).length;html+='<div class="warnbox"><b>هيتضاف '+N(preview.list.length)+' حصة</b>'+(preview.list.length?'<span>من '+shortDate(preview.list[0].date)+' إلى '+shortDate(preview.list[preview.list.length-1].date)+'</span><span>في المكان: '+N(preview.list.length-on)+' · أونلاين: '+N(on)+'</span>':'<span>الخطة مكتملة بالفعل.</span>')+(preview.unplaced?'<span>تعذر وضع '+N(preview.unplaced)+' حصة (انتهى التاريخ).</span>':'')+(preview.conf?'<span>فيها '+N(preview.conf)+' حصة متعارضة مع مواعيد تانية أو المدرسة، هتتعلّم تعارض.</span>':'')+'</div>';}
  html+='<div class="acts">'+(preview&&preview.list.length?'<button type="button" class="btn" data-act="genGo" data-id="'+gid+'">أكّد الإضافة</button>':'')+'<button type="button" class="btn ghost" data-act="genPrev" data-id="'+gid+'">'+(preview?'حدّث المعاينة':'معاينة')+'</button><button type="button" class="btn ghost" data-act="back">إلغاء</button></div>';

function genCompute(g,from,every){
  var L=lessonsOf(g.id).filter(function(l){return l.status!=='cancelled';});
  var have=function(k){return L.filter(function(l){return l.kind===k;}).length;},mx=function(k){return L.filter(function(l){return l.kind===k;}).reduce(function(m,l){return Math.max(m,l.n||0);},0);};
  var need={explain:Math.max(0,g.planned-have('explain')),exam:Math.max(0,g.exams-have('exam')),review:Math.max(0,g.reviews-have('review'))},seq=[],xm=0,i;
  for(i=1;i<=need.explain;i++){seq.push('explain');if(every&&i%every===0&&xm<need.exam){seq.push('exam');xm++;}}
  for(i=0;i<need.review;i++)seq.push('review');while(xm<need.exam){seq.push('exam');xm++;}
  var taken={};L.forEach(function(l){taken[l.date]=1;});
  var d=from,last=g.days.length?addDays(from,730):from,idx=0,nums={explain:mx('explain'),exam:mx('exam'),review:mx('review')},out=[];
  while(idx<seq.length&&d<=last){if(g.days.indexOf(pd(d).getDay())>=0&&!taken[d]){var k=seq[idx++];nums[k]++;var nl=mkLesson(g.id,k,d,g.time,g.end,g.venue,nums[k]);if(g.dayMode[pd(d).getDay()]==='online'){nl.mode='online';nl.venue='';}out.push(nl);}d=addDays(d,1);}
  var conf=out.filter(function(l){return conflictsOf(l).length||schoolConf(l).length;}).length;
  return {list:out,unplaced:seq.length-out.length,conf:conf,from:from,every:every};
}

  return code;
}

async function recCheck(){
  var e=$('#recErr'),v=normRec(val('recIn')),now=Date.now();
  if(now<recLock){e.textContent='حاولت كتير. استنى '+N(Math.ceil((recLock-now)/1000))+' ثانية.';return;}
  if(v.length!==16){e.textContent='الكود مكون من ١٦ حرف ورقم.';return;}
  try{
    var h=await sha(S.pin.rec.salt+v);
    if(h===S.pin.rec.hash){recTries=0;
      $('#lock').innerHTML='<div class="box"><h2>الكود صح</h2><p class="muted">اختر رقم سري جديد (٤ أرقام على الأقل).</p><input id="np1" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" aria-label="الرقم الجديد"><input id="np2" type="password" inputmode="numeric" maxlength="12" autocomplete="new-password" aria-label="تأكيد الرقم الجديد"><p class="err" id="npErr" role="alert"></p><button type="button" class="btn block" data-act="recNewPin">حفظ الرقم الجديد</button></div>';
    }else{recTries++;if(recTries>=5){recLock=now+30000;recTries=0;e.textContent='الكود غلط. استنى ٣٠ ثانية قبل المحاولة الجاية.';}else e.textContent='الكود غلط.';}
  }catch(x){e.textContent='تعذر التحقق.';}
}

  addExam:function(e){var gid=e.dataset.gid,g=grp(gid),d=today(),i;for(i=0;i<60;i++){var k=addDays(d,i);if(g.days.indexOf(pd(k).getDay())>=0){d=k;break;}}sheetBack=null;lessonForm(null,gid,d,true,'exam');},
  saveAtt:function(e){var id=e.dataset.id,l=lsn(id),r=readAtt(l);if(r.err){$('#aaErr').textContent=r.err;return;}S.att[id]=r.att;S.sc[id]=r.sc;logAdd('حضور ودرجات '+grp(l.gid).name+' '+l.date);after('اتحفظ الحضور والدرجات');},
  pinSet:function(){openSheet(head('قفل بكلمة سر')+'<p class="muted small">اختر رقم سري من ٤ أرقام على الأقل. بعد الحفظ هنديك <b>كود استرجاع</b> تحتفظ بيه، ولو نسيت الرقم تكتب الكود وتختار رقم جديد من غير ما تتمسح بياناتك.</p>'+fld('pn1','الرقم السري',inp('pn1','password','','inputmode="numeric" maxlength="12" autocomplete="new-password"'))+fld('pn2','أكّد الرقم',inp('pn2','password','','inputmode="numeric" maxlength="12" autocomplete="new-password"'))+'<p class="err" id="pnErr" role="alert"></p><div class="acts"><button type="button" class="btn" data-act="pinSave">حفظ</button><button type="button" class="btn ghost" data-act="back">إلغاء</button></div>');},
  pinSave:async function(){var a=val('pn1'),b=val('pn2'),e=$('#pnErr');if(!/^\d{4,12}$/.test(west(a))){e.textContent='الرقم لازم يكون ٤ أرقام على الأقل.';return;}if(a!==b){e.textContent='الرقمين مش متطابقين.';return;}if(!(window.crypto&&crypto.subtle)){e.textContent='المتصفح ده مش بيدعم القفل.';return;}var code=await setPinAndRec(a);logAdd('تفعيل قفل الصفحة');save();render();recSheet(code,'كود الاسترجاع بتاعك');},
  recNew:function(){ask('هنعمل كود استرجاع جديد، والكود القديم (لو كان فيه) هيبطل. تكمل؟','اعمل كود جديد',async function(){var code=genRec(),rs=uid()+uid();S.pin.rec={salt:rs,hash:await sha(rs+normRec(code))};logAdd('كود استرجاع جديد');save();render();recSheet(code,'كود الاسترجاع الجديد');});},
  recCopy:function(e){copyText(e.dataset.code,'اتنسخ الكود');},
  recDone:function(){closeSheet();toast('احتفظ بالكود في مكان آمن');},
  forgotPin:function(){showForgot();},
  recCheck:recCheck,
  noCode:function(){$('#lock').innerHTML='<div class="box"><h2>معندكش الكود؟</h2><p class="muted">مفيش باب خلفي، ده عشان محدش غيرك يفتح بياناتك. الحل الوحيد إنك تمسح بيانات الجهاز ده وبعدين تسترجع آخر نسخة احتياطية (النسخ مش بتشمل الرقم).</p><button type="button" class="btn danger block" data-act="wipePin">امسح البيانات وابدأ من جديد</button><button type="button" class="btn ghost block" data-act="forgotPin">رجوع</button></div>';},
  recNewPin:async function(){var a=val('np1'),b=val('np2'),e=$('#npErr');if(!/^\d{4,12}$/.test(west(a))){e.textContent='الرقم لازم يكون ٤ أرقام على الأقل.';return;}if(a!==b){e.textContent='الرقمين مش متطابقين.';return;}var code=await setPinAndRec(a);logAdd('استرجاع الدخول بكود الاسترجاع وتغيير الرقم');save();locked=false;$('#lock').hidden=true;$('#lock').innerHTML='';lastActive=Date.now();render();recSheet(code,'كود استرجاع جديد');},
  tab:function(e){tab=e.dataset.id;render();window.scrollTo(0,0);},
  close:closeSheet,back:back,
  doPending:function(){var f=pendingFn;pendingFn=null;if(f)f();},
  wk:function(e){var n=+e.dataset.n;wkOff=n===0?0:wkOff+n;render();},
  mrange:function(e){moneyRange=e.dataset.id;render();},
  alert:function(e){var a=window.__al[+e.dataset.i];if(a)ACT[a.act]({dataset:{id:a.arg,date:a.arg}});},
  goDay:function(e){tab='sched';var d=e.dataset.date||e.dataset.id,t=today(),ws=pd(t);ws.setDate(ws.getDate()-((ws.getDay()+1)%7));wkOff=Math.floor(dayDiff(d,dk(ws))/7);render();setTimeout(function(){var el=document.getElementById('d'+d);if(el)el.scrollIntoView();},30);},
  goSched:function(){tab='sched';wkOff=0;render();},goMoney:function(){tab='money';render();},goMore:function(){tab='more';render();},
  clearDemo:function(){ask('هتتمسح بيانات التجربة كلها وتبدأ من الصفر. تكمل؟','امسح التجربة',function(){var o=blank();o.theme=S.theme;S=o;save();closeSheet();render();toast('اتمسحت التجربة');},true);},
  addG:function(){groupForm(null);},editG:function(e){var id=e.dataset.id;sheetBack=function(){openGroup(id);};groupForm(grp(id));},
  openG:function(e){openGroup(e.dataset.id);},
  saveG:function(e){saveGroup(e.dataset.id);},
  delG:function(e){var g=grp(e.dataset.id),id=g.id;ask('حذف «'+esc(g.name)+'»؟ بيتشال من القوائم لكن مدفوعات الطلاب بتفضل محسوبة في الإجمالي.','احذف المجموعة',function(){g.deleted=true;logAdd('حذف مجموعة: '+g.name);save();closeSheet();render();toast('اتحذفت المجموعة');},true);},
  addS:function(e){var gid=e.dataset.gid||'';sheetBack=gid?function(){openGroup(gid);}:null;studentForm(null,gid);},
  editS:function(e){sheetBack=ctx;studentForm(stu(e.dataset.id));},
  openS:function(e){sheetBack=ctx;openStudent(e.dataset.id);},
  saveS:function(e){saveStudent(e.dataset.id,e.dataset.force==='1');},
  delS:function(e){var s=stu(e.dataset.id);ask('حذف الطالب «'+esc(s.name)+'»؟ دفعاته بتفضل محسوبة في الإجمالي.','احذف الطالب',function(){s.deleted=true;s.active=false;logAdd('حذف طالب: '+s.name);save();closeSheet();render();toast('اتحذف الطالب');},true);},
  cancelEnr:function(e){var s=stu(e.dataset.id),id=s.id;ask('إلغاء تسجيل «'+esc(s.name)+'» في المجموعة؟ مدفوعاته بتفضل محفوظة.','ألغِ التسجيل',function(){s.active=false;s.status='cancelled';s.endedAt=today();logAdd('إلغاء تسجيل: '+s.name);save();render();toast('اتلغى التسجيل');sheetBack=stuBack;openStudent(id);},true);},
  xfer:function(e){xferSheet(e.dataset.id);},
  doXfer:function(e){var s=stu(e.dataset.id),g=grp(val('xGrp')),err=$('#xErr');if(!g){err.textContent='اختر المجموعة.';return;}if(activeOf(g.id).length>=g.cap){err.textContent='المجموعة دي مكتملة.';return;}
    var ns=mkStudent(g.id,s.name,s.phone,s.parent,defDue(g));ns.notes=s.notes;ns.from=s.id;s.active=false;s.status='transferred';s.endedAt=today();S.students.push(ns);logAdd('نقل '+s.name+' من '+grp(s.gid).name+' إلى '+g.name);save();render();toast('اتنقل الطالب');sheetBack=stuBack;openStudent(ns.id);},
  pay:function(e){sheetBack=ctx;paySheet(e.dataset.id);},
  savePay:function(e){savePay(e.dataset.id,e.dataset.force==='1');},
  rcpt:function(e){receipt(e.dataset.id,e.dataset.pid,sheetBack);},
  copyRcpt:function(e){copyText(rcptText(e.dataset.id,e.dataset.pid),'اتنسخ الإيصال');},
  adj:function(e){adjSheet(e.dataset.id);},
  aKind:function(e){document.querySelectorAll('#aKind button').forEach(function(b){b.setAttribute('aria-pressed',b===e?'true':'false');});},
  saveAdj:function(e){saveAdj(e.dataset.id);},
  voidP:function(e){voidSheet(e.dataset.id,e.dataset.pid);},
  doVoid:function(e){var s=stu(e.dataset.id),p=s.pays.filter(function(x){return x.id===e.dataset.pid;})[0],w=val('vWhy');if(!w){$('#vErr').textContent='اكتب سبب الإلغاء.';return;}p.void=true;p.voidReason=w;logAdd('إلغاء دفعة '+M(p.amt)+' للطالب '+s.name+' — '+w);save();render();toast('اتلغت الدفعة');sheetBack=stuBack;openStudent(s.id);},
  addL:function(e){var gid=e.dataset.gid||'';sheetBack=null;lessonForm(null,gid,e.dataset.date,!!gid);},
  editL:function(e){lessonForm(lsn(e.dataset.id),null,null,e.dataset.from==='g');},
  saveL:function(e){saveLesson(e.dataset.id,e.dataset.force==='1');},
  delL:function(e){var l=lsn(e.dataset.id);ask('حذف الحصة؟ لو عليها حضور اعتبرها «ملغاة» بدل الحذف.','احذف الحصة',function(){if(S.att[l.id]){toast('عليها سجل حضور. اجعلها ملغاة بدل الحذف.');closeSheet();return;}S.lessons=S.lessons.filter(function(x){return x.id!==l.id;});logAdd('حذف حصة '+grp(l.gid).name+' '+l.date);save();closeSheet();render();toast('اتحذفت الحصة');},true);},
  lDone:function(e){setLessonStatus(e.dataset.id,'done');toast('اتسجلت الحصة «تمت»');},
  lCancel:function(e){var l=lsn(e.dataset.id);ask('إلغاء حصة '+esc(grp(l.gid).name)+' يوم '+fmtDate(l.date)+'؟','ألغِ الحصة',function(){setLessonStatus(l.id,'cancelled');closeSheet();toast('اتلغت الحصة');},true);},
  lSched:function(e){var l=lsn(e.dataset.id),cf=conflictsOf(l);setLessonStatus(l.id,'scheduled');toast(cf.length?'رجعت مجدولة، بس فيها تعارض':'رجعت مجدولة');},
  lPost:function(e){postponeSheet(e.dataset.id);},doPost:function(e){doPost(e.dataset.id,e.dataset.force==='1');},
  lAtt:function(e){attSheet(e.dataset.id,e.dataset.from==='g');},
  att:function(e){var seg=e.parentNode;seg.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===e?'true':'false');});},
  gen:function(e){genSheet(e.dataset.id,null);},
  genPrev:function(e){var g=grp(e.dataset.id),f=val('xFrom')||today(),ev=Math.max(0,Math.floor(toNum(val('xEvery')||'0'))||0),r=genCompute(g,f,ev);genSheet(g.id,r);},
  genGo:function(e){var g=grp(e.dataset.id),f=val('xFrom')||today(),ev=Math.max(0,Math.floor(toNum(val('xEvery')||'0'))||0),r=genCompute(g,f,ev);r.list.forEach(function(l){S.lessons.push(l);});logAdd('توليد '+r.list.length+' حصة لمجموعة '+g.name);save();render();toast('اتضافت '+N(r.list.length)+' حصة');sheetBack=null;openGroup(g.id);},
  theme:function(e){S.theme=e.dataset.id;save();render();},
  saveSet:function(){var n=toNum(val('setNear'));if(!(n>=1)){toast('الرقم لازم يكون ١ أو أكتر.');return;}S.teacher=val('setName');S.nearFull=Math.floor(n);save();render();toast('اتحفظت الإعدادات');},
  pinOff:function(){ask('إزالة القفل؟','شيل القفل',function(){S.pin=null;logAdd('إزالة قفل الصفحة');save();render();closeSheet();toast('اتشال القفل');},true);},
  lockNow:function(){showLock();},
  unlock:tryUnlock,
  lockBack:function(){showLock();},
  wipePin:function(){try{localStorage.removeItem(KEY);}catch(e){}S=blank();save();locked=false;$('#lock').hidden=true;$('#lock').innerHTML='';render();toast('اتمسحت البيانات. اضغط «استرجع من نسخة» لو عندك نسخة.');tab='more';render();},
  bkMake:function(){var text=makeBackup();S.lastBackup=Date.now();save();render();openSheet(head('النسخة الاحتياطية')+'<p class="muted small">انسخ النص ده كله واحفظه في مكان آمن (رسالة لنفسك على واتساب، أو ملاحظات). لاسترجاعه استخدم «استرجع من نسخة».</p><textarea id="bkTx" class="code" readonly>'+esc(text)+'</textarea><div class="acts"><button type="button" class="btn" data-act="bkCopy">نسخ النسخة</button><button type="button" class="btn ghost" data-act="back">تم</button></div>');},
  bkCopy:function(){var t=$('#bkTx');copyText(t.value,'اتنسخت النسخة الاحتياطية');},
  bkRestore:function(){openSheet(head('استرجاع من نسخة')+'<p class="muted small">الصق نص النسخة الاحتياطية هنا، أو اختر الملف. هنتأكد إنها سليمة قبل ما نستبدل بياناتك الحالية، وبنحتفظ بنسخة من الحالة الحالية قبل الاسترجاع.</p><textarea id="rsTx" class="code" placeholder="الصق النسخة هنا"></textarea><input id="rsFile" type="file" accept=".json,.txt,application/json,text/plain" aria-label="اختر ملف نسخة"><p class="err" id="rsErr" role="alert"></p><div id="rsInfo"></div><div class="acts"><button type="button" class="btn" data-act="rsCheck">تحقق من النسخة</button><button type="button" class="btn ghost" data-act="back">إلغاء</button></div>');},
  rsCheck:function(){var r=verifyBackup(val('rsTx'));if(r.err){$('#rsErr').textContent=r.err;$('#rsInfo').innerHTML='';return;}$('#rsErr').textContent='';window.__rs=r.ok;var c=r.ok.counts||{};$('#rsInfo').innerHTML='<div class="warnbox"><b>النسخة سليمة</b><span>بتاريخ '+esc(new Date(r.ok.at).toLocaleString('ar-EG'))+'</span><span>'+N(c.groups)+' مجموعة · '+N(c.students)+' طالب · '+N(c.lessons)+' حصة · '+N(c.payments)+' دفعة</span><span>الاسترجاع بيستبدل كل بياناتك الحالية.</span><button type="button" class="btn sm" data-act="rsGo">أكّد الاسترجاع</button></div>';},
  rsGo:function(){if(!window.__rs)return;restoreBackup(window.__rs);window.__rs=null;render();closeSheet();toast('اتسترجعت البيانات');},
  wipe:function(){ask('هتتمسح كل البيانات من الجهاز ده (مجموعات وطلاب ومدفوعات). متأكد؟','امسح كل شيء',function(){try{localStorage.setItem(PRE,JSON.stringify(S));}catch(e){}var o=blank();o.theme=S.theme;S=o;save();closeSheet();tab='today';render();toast('اتمسحت كل البيانات');},true);}
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;var f=ACT[el.dataset.act];if(!f)return;ev.preventDefault();lastActive=Date.now();f(el);
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='stq'){stQ=ev.target.value;studentSearch();}
  if(ev.target.id==='rpq'){var b=$('#rpres');if(b)b.innerHTML=ev.target.value.trim()?stuRows(matchStudents(ev.target.value),'rpStu'):'';}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='sGrp'){var g=grp(ev.target.value),d=document.getElementById('sDue');if(g&&d)d.value=defDue(g);}
  if(ev.target.id==='rsFile'&&ev.target.files[0]){var fr=new FileReader();fr.onload=function(){var t=$('#rsTx');if(t)t.value=String(fr.result||'');};fr.readAsText(ev.target.files[0]);}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='pinIn'){ev.preventDefault();tryUnlock();}if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
['pointerdown','keydown','touchstart'].forEach(function(n){document.addEventListener(n,function(){lastActive=Date.now();},{passive:true});});
setInterval(function(){if(S.pin&&!locked&&Date.now()-lastActive>10*60*1000)showLock();},30000);

/* ================= boot ================= */
render();save();
if(S.pin)showLock();
document.addEventListener('visibilitychange',function(){if(!document.hidden)render();});
})();
</script>
